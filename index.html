<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>GridWall 100 — 100-Player YouTube Video Wall</title>
  <meta name="description" content="Single-file 100-window simultaneous YouTube video wall with batch loading, responsive 10x10 grid density controls, and global, solo, and per-tile audio management." />
  <meta property="og:title" content="GridWall 100 — 100-Player YouTube Video Wall" />
  <meta property="og:description" content="Single-file 100-window simultaneous YouTube video wall with batch loading, responsive 10x10 grid density controls, and global, solo, and per-tile audio management." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       DESIGN TOKENS & BASE RESET
       Dark-mode surveillance control aesthetic: #0f172a canvas, #1e293b bar,
       #3b82f6 primary action accent, #ef4444 muted state indicator.
       ========================================================================= */
    :root {
      --bg-canvas: #0f172a;
      --bg-bar: #1e293b;
      --bg-tile: #131d33;
      --bg-tile-idle: #16223a;
      --bg-input: #0f172a;
      --bg-control: #273549;
      --bg-control-hover: #334155;

      --border-subtle: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(148, 163, 184, 0.28);

      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;

      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-red: #ef4444;
      --accent-red-soft: rgba(239, 68, 68, 0.14);
      --accent-green: #22c55e;
      --accent-green-soft: rgba(34, 197, 94, 0.14);
      --accent-amber: #f59e0b;

      --bar-height: 56px;
      --grid-gap: 3px;
      --grid-pad: 4px;

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: 0.01em;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body.mode-fit {
      overflow: hidden;
    }

    /* =========================================================================
       COMPACT STICKY TOP CONTROL BAR (~56px)
       Reserves 94%+ of viewport height for the 10x10 video grid.
       ========================================================================= */
    .control-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--bar-height);
      min-height: var(--bar-height);
      background-color: var(--bg-bar);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      width: 100%;
      flex-shrink: 0;
    }

    /* Subtle batch-loading progress hairline along bottom edge of control bar */
    .load-progress-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
    }

    .load-progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent-blue);
      transition: width 140ms linear, opacity 250ms ease;
      opacity: 0;
    }

    .load-progress-fill.active {
      opacity: 1;
    }

    /* Brand Wordmark */
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      flex-shrink: 0;
      user-select: none;
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: rgba(59, 130, 246, 0.16);
      border: 1px solid rgba(59, 130, 246, 0.38);
      display: grid;
      grid-template-columns: repeat(2, 5px);
      grid-template-rows: repeat(2, 5px);
      gap: 2px;
      place-content: center;
      flex-shrink: 0;
    }

    .brand-mark span {
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 1px;
      background: var(--accent-blue);
    }

    .brand-mark span:nth-child(2),
    .brand-mark span:nth-child(3) {
      opacity: 0.55;
    }

    .bar-divider {
      width: 1px;
      height: 24px;
      background: var(--border-subtle);
      flex-shrink: 0;
    }

    /* URL Input Group */
    .url-form {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 220px;
      min-width: 170px;
      max-width: 440px;
    }

    .url-input-wrap {
      position: relative;
      flex: 1;
      min-width: 120px;
    }

    .url-input {
      width: 100%;
      height: 36px;
      padding: 0 30px 0 11px;
      background-color: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 13px;
      outline: none;
      transition: border-color 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
    }

    .url-input::placeholder {
      color: var(--text-muted);
    }

    .url-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    .url-clear-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: color 120ms ease, background-color 120ms ease;
    }

    .url-clear-btn.visible {
      display: flex;
    }

    .url-clear-btn:hover {
      color: var(--text-primary);
      background: rgba(148, 163, 184, 0.14);
    }

    /* Action Buttons */
    .btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      transition: background-color 150ms var(--ease-out),
                  border-color 150ms var(--ease-out),
                  color 150ms var(--ease-out),
                  transform 100ms var(--ease-out);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0.5px);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-blue-hover);
    }

    .btn-secondary {
      background-color: var(--bg-control);
      border-color: var(--border-subtle);
      color: var(--text-primary);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--bg-control-hover);
      border-color: var(--border-strong);
    }

    /* Mute / Unmute Toggle States */
    .btn-audio-muted {
      background-color: var(--accent-red-soft);
      border-color: rgba(239, 68, 68, 0.42);
      color: #fca5a5;
    }

    .btn-audio-muted:hover:not(:disabled) {
      background-color: rgba(239, 68, 68, 0.24);
      border-color: rgba(239, 68, 68, 0.65);
      color: #fecaca;
    }

    .btn-audio-live {
      background-color: var(--accent-green-soft);
      border-color: rgba(34, 197, 94, 0.42);
      color: #86efac;
    }

    .btn-audio-live:hover:not(:disabled) {
      background-color: rgba(34, 197, 94, 0.24);
      border-color: rgba(34, 197, 94, 0.65);
      color: #bbf7d0;
    }

    .btn-solo-active {
      background-color: rgba(59, 130, 246, 0.18);
      border-color: rgba(59, 130, 246, 0.55);
      color: #93c5fd;
    }

    .btn-solo-active:hover:not(:disabled) {
      background-color: rgba(59, 130, 246, 0.26);
    }

    .btn-danger-ghost {
      background-color: transparent;
      border-color: var(--border-subtle);
      color: var(--text-secondary);
    }

    .btn-danger-ghost:hover:not(:disabled) {
      background-color: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    /* Segmented Grid Density / Zoom Toggle */
    .density-toggle {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 3px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .density-btn {
      height: 28px;
      padding: 0 9px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
    }

    .density-btn svg {
      width: 13px;
      height: 13px;
    }

    .density-btn:hover {
      color: var(--text-primary);
    }

    .density-btn.active {
      background-color: var(--bg-control-hover);
      color: var(--text-primary);
    }

    .density-btn:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 1px;
    }

    /* Controls Group */
    .controls-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Live Status Telemetry Strip (clean unboxed tabular typography) */
    .status-strip {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .status-value {
      color: var(--text-primary);
      font-weight: 500;
    }

    .status-value.is-muted {
      color: #f87171;
    }

    .status-value.is-live {
      color: #4ade80;
    }

    .status-value.is-solo {
      color: #60a5fa;
    }

    .status-sep {
      color: rgba(148, 163, 184, 0.35);
      user-select: none;
    }

    /* =========================================================================
       100-WINDOW VIDEO WALL VIEWPORT & CSS GRID
       ========================================================================= */
    .wall-viewport {
      flex: 1 1 auto;
      width: 100%;
      padding: var(--grid-pad);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-canvas);
    }

    /* Fit All 100 on Screen Mode:
       Exact 10x10 strict 16:9 matrix constrained so all 100 tiles stay 100%
       visible simultaneously with zero vertical or horizontal scroll on
       1080p, 1440p, 720p, and ultrawide displays. */
    body.mode-fit .wall-viewport {
      height: calc(100vh - var(--bar-height));
      overflow: hidden;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: var(--grid-gap);
      width: 100%;
    }

    body.mode-fit .video-grid {
      /* Mathematically cap width so 10 rows of strict 16:9 tiles + 9 gaps never exceed available height */
      max-width: min(
        100%,
        calc((100vh - var(--bar-height) - (var(--grid-pad) * 2) - (var(--grid-gap) * 9)) * 16 / 9 + (var(--grid-gap) * 9))
      );
      margin: 0 auto;
    }

    /* Larger Scrollable Tiles Mode */
    body.mode-scroll {
      overflow-y: auto;
    }

    body.mode-scroll .wall-viewport {
      align-items: flex-start;
      padding: 10px;
    }

    body.mode-scroll .video-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      max-width: 1920px;
      margin: 0 auto;
    }

    /* Individual 16:9 Player Tile */
    .player-tile {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-tile);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 3px;
      overflow: hidden;
      isolation: isolate;
      transition: border-color 150ms var(--ease-out);
    }

    .player-tile:hover {
      border-color: rgba(148, 163, 184, 0.38);
      z-index: 2;
    }

    /* Highlight tile when its audio is actively unmuted */
    .player-tile.audio-active {
      border-color: var(--accent-blue);
      box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.45);
    }

    .player-tile.tile-error {
      border-color: rgba(239, 68, 68, 0.45);
    }

    /* Mount point where the YouTube <iframe> renders */
    .player-mount {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
    }

    .player-mount iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Standby / Loading Overlay */
    .tile-placeholder {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: var(--bg-tile-idle);
      pointer-events: none;
      transition: opacity 200ms ease;
    }

    .player-tile.is-loaded .tile-placeholder {
      opacity: 0;
      visibility: hidden;
    }

    .placeholder-index {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: rgba(148, 163, 184, 0.42);
      user-select: none;
    }

    .placeholder-state {
      font-family: var(--font-mono);
      font-size: 9px;
      color: rgba(148, 163, 184, 0.28);
      display: none;
    }

    body.mode-scroll .placeholder-index {
      font-size: 13px;
    }

    body.mode-scroll .placeholder-state {
      display: block;
      font-size: 11px;
    }

    /* Shimmer animation during staggered batch loading */
    .player-tile.is-loading .tile-placeholder {
      background: linear-gradient(
        110deg,
        var(--bg-tile-idle) 25%,
        #1e2d4a 50%,
        var(--bg-tile-idle) 75%
      );
      background-size: 220% 100%;
      animation: tileShimmer 1.3s ease-in-out infinite;
    }

    @keyframes tileShimmer {
      0% { background-position: 180% 0; }
      100% { background-position: -40% 0; }
    }

    /* Subtle Numbered Badge (#1 to #100) */
    .tile-badge {
      position: absolute;
      top: 3px;
      left: 3px;
      z-index: 10;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(15, 23, 42, 0.78);
      color: rgba(248, 250, 252, 0.88);
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      opacity: 0.72;
      transition: opacity 140ms ease, background-color 140ms ease;
    }

    .player-tile:hover .tile-badge,
    .player-tile.audio-active .tile-badge {
      opacity: 1;
    }

    .player-tile.audio-active .tile-badge {
      background: rgba(37, 99, 235, 0.9);
      color: #ffffff;
    }

    body.mode-scroll .tile-badge {
      top: 6px;
      left: 6px;
      padding: 2px 6px;
      font-size: 11px;
    }

    /* Individual Tile Mute/Unmute Button (Visible on hover or when unmuted) */
    .tile-audio-btn {
      position: absolute;
      top: 3px;
      right: 3px;
      z-index: 12;
      width: 22px;
      height: 22px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.84);
      color: #fca5a5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 140ms var(--ease-out),
                  transform 140ms var(--ease-out),
                  background-color 140ms ease,
                  color 140ms ease;
    }

    .tile-audio-btn svg {
      width: 12px;
      height: 12px;
    }

    .player-tile.is-loaded:hover .tile-audio-btn,
    .player-tile.is-loaded .tile-audio-btn:focus-visible,
    .player-tile.is-loaded.audio-active .tile-audio-btn {
      opacity: 1;
      transform: scale(1);
    }

    .player-tile.audio-active .tile-audio-btn {
      background: rgba(22, 163, 74, 0.92);
      border-color: rgba(134, 239, 172, 0.45);
      color: #ffffff;
    }

    .tile-audio-btn:hover {
      background: rgba(30, 41, 59, 0.96);
    }

    .player-tile.audio-active .tile-audio-btn:hover {
      background: rgba(21, 128, 61, 0.98);
    }

    .tile-audio-btn:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 1px;
    }

    body.mode-scroll .tile-audio-btn {
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
    }

    body.mode-scroll .tile-audio-btn svg {
      width: 14px;
      height: 14px;
    }

    /* =========================================================================
       TOAST NOTIFICATION (Validation Errors & Notices)
       ========================================================================= */
    .toast-region {
      position: fixed;
      top: calc(var(--bar-height) + 12px);
      right: 14px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      max-width: 380px;
    }

    .toast {
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background-color: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.24);
      box-shadow: 0 10px 25px rgba(2, 6, 23, 0.55);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.4;
      transform: translateY(-6px);
      opacity: 0;
      transition: transform 180ms var(--ease-out), opacity 180ms var(--ease-out);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.toast-error {
      border-color: rgba(239, 68, 68, 0.5);
    }

    .toast.toast-info {
      border-color: rgba(59, 130, 246, 0.45);
    }

    .toast-icon {
      flex-shrink: 0;
      margin-top: 1px;
    }

    .toast-error .toast-icon {
      color: var(--accent-red);
    }

    .toast-info .toast-icon {
      color: var(--accent-blue);
    }

    .toast-body {
      flex: 1;
      min-width: 0;
    }

    .toast-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toast-close:hover {
      color: var(--text-primary);
      background: rgba(148, 163, 184, 0.15);
    }

    /* =========================================================================
       RESPONSIVE BREAKPOINTS
       ========================================================================= */
    @media (max-width: 1360px) {
      .control-bar {
        gap: 7px;
        padding: 0 10px;
      }

      .btn {
        padding: 0 9px;
        font-size: 12px;
      }

      .status-strip {
        font-size: 11px;
        gap: 6px;
      }

      .brand-text {
        display: none;
      }
    }

    @media (max-width: 1140px) {
      .control-bar {
        height: auto;
        min-height: var(--bar-height);
        flex-wrap: wrap;
        padding: 8px 10px;
        gap: 8px;
      }

      .bar-divider {
        display: none;
      }

      .url-form {
        max-width: none;
        flex: 1 1 280px;
      }

      .status-strip {
        margin-left: 0;
      }

      body.mode-fit {
        overflow-y: auto;
      }

      body.mode-fit .wall-viewport {
        height: auto;
        overflow: visible;
      }

      body.mode-fit .video-grid {
        max-width: 100%;
      }

      body.mode-scroll .video-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      body.mode-fit .video-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      body.mode-scroll .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .controls-group {
        flex-wrap: wrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="mode-fit">
  <!-- =========================================================================
       COMPACT STICKY TOP CONTROL BAR (~56px)
       ========================================================================= -->
  <header class="control-bar" role="banner">
    <div class="brand" title="GridWall 100 — 100-Player Video Matrix">
      <span class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>

    <!-- Live Status Telemetry Strip -->

  <!-- =========================================================================
       100-WINDOW VIDEO WALL GRID (10x10 MATRIX)
       ========================================================================= -->
  <main class="wall-viewport" aria-label="100-window YouTube video wall">
    <div id="videoGrid" class="video-grid"></div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastRegion" class="toast-region" aria-live="assertive" aria-atomic="true"></div>

  <!-- =========================================================================
       APPLICATION LOGIC — YOUTUBE IFRAME PLAYER API & 100x MATRIX CONTROLLER
       ========================================================================= -->
  <script>
    (() => {
      'use strict';

      /* -----------------------------------------------------------------------
         CONFIGURATION & APPLICATION STATE
         ----------------------------------------------------------------------- */
      const TOTAL_PLAYERS = 100;
      const BATCH_SIZE = 10;
      const BATCH_DELAY_MS = 150;

      const state = {
        apiReady: false,
        currentVideoId: null,
        loadSessionId: 0,
        batchTimers: [],
        iframes: new Array(TOTAL_PLAYERS).fill(null),
        players: new Array(TOTAL_PLAYERS).fill(null),
        ytAttachedFlags: new Array(TOTAL_PLAYERS).fill(false),
        loadedFlags: new Array(TOTAL_PLAYERS).fill(false),
        ytReadyFlags: new Array(TOTAL_PLAYERS).fill(false),
        tileMuted: new Array(TOTAL_PLAYERS).fill(true),
        // Target audio policy applied to active players and newly-ready players
        // 'muted' | 'all' | 'solo' | 'custom'
        audioMode: 'muted',
        embedErrorShownForSession: false,
        density: 'fit', // 'fit' | 'scroll'
      };

      /* -----------------------------------------------------------------------
         SVG ICON TEMPLATES (Self-contained, zero external icon dependencies)
         ----------------------------------------------------------------------- */
      const ICONS = {
        speakerMuted: `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="22" y1="9" x2="16" y2="15"></line>
            <line x1="16" y1="9" x2="22" y2="15"></line>
          </svg>`,
        speakerActive: `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>`,
        errorIcon: `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>`,
        infoIcon: `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>`,
      };

      /* -----------------------------------------------------------------------
         DOM REFERENCES
         ----------------------------------------------------------------------- */
      const els = {
        loadForm: document.getElementById('loadForm'),
        urlInput: document.getElementById('youtubeUrlInput'),
        clearInputBtn: document.getElementById('clearInputBtn'),
        loadAllBtn: document.getElementById('loadAllBtn'),
        muteToggleBtn: document.getElementById('muteToggleBtn'),
        muteToggleIcon: document.getElementById('muteToggleIcon'),
        muteToggleLabel: document.getElementById('muteToggleLabel'),
        soloBtn: document.getElementById('soloBtn'),
        stopClearBtn: document.getElementById('stopClearBtn'),
        densityFitBtn: document.getElementById('densityFitBtn'),
        densityScrollBtn: document.getElementById('densityScrollBtn'),
        statusVideoId: document.getElementById('statusVideoId'),
        statusPlayerCount: document.getElementById('statusPlayerCount'),
        statusAudioState: document.getElementById('statusAudioState'),
        loadProgressFill: document.getElementById('loadProgressFill'),
        videoGrid: document.getElementById('videoGrid'),
        toastRegion: document.getElementById('toastRegion'),
      };

      // Cache tile DOM references for fast O(1) updates across all 100 cells
      const tileRefs = [];

      /* -----------------------------------------------------------------------
         ROBUST YOUTUBE VIDEO ID PARSER
         Accepts standard watch URLs, shortened youtu.be links, /shorts/,
         /embed/, /live/, /v/, mobile/music subdomains, or raw 11-char IDs.
         ----------------------------------------------------------------------- */
      function extractYouTubeVideoId(rawInput) {
        if (!rawInput || typeof rawInput !== 'string') return null;
        const trimmed = rawInput.trim();
        if (!trimmed) return null;

        // 1. Direct 11-character YouTube Video ID
        const rawIdRegex = /^[a-zA-Z0-9_-]{11}$/;
        if (rawIdRegex.test(trimmed)) {
          return trimmed;
        }

        // 2. Parse as URL (prepend https:// if user omitted scheme)
        const normalizedUrl = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
        try {
          const url = new URL(normalizedUrl);
          const host = url.hostname.replace(/^www\./i, '').toLowerCase();
          const isYouTubeHost =
            host === 'youtu.be' ||
            host === 'youtube.com' ||
            host.endsWith('.youtube.com') ||
            host === 'youtube-nocookie.com' ||
            host.endsWith('.youtube-nocookie.com');

          if (isYouTubeHost) {
            // Standard ?v=VIDEO_ID
            const vParam = url.searchParams.get('v');
            if (vParam && rawIdRegex.test(vParam)) {
              return vParam;
            }

            // Path-based formats: youtu.be/<id>, /shorts/<id>, /embed/<id>, /live/<id>, /v/<id>
            const pathParts = url.pathname.split('/').filter(Boolean);
            if (host === 'youtu.be' && pathParts[0] && rawIdRegex.test(pathParts[0])) {
              return pathParts[0];
            }

            const validPrefixes = ['shorts', 'embed', 'live', 'v', 'e'];
            if (
              pathParts.length >= 2 &&
              validPrefixes.includes(pathParts[0].toLowerCase()) &&
              rawIdRegex.test(pathParts[1])
            ) {
              return pathParts[1];
            }
          }
        } catch (_) {
          // Fall through to regex extraction below
        }

        // 3. Fallback Regex for embedded or irregular YouTube URL strings
        const fallbackRegex =
          /(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})(?:[?&#/]|$)/i;
        const match = trimmed.match(fallbackRegex);
        return match && match[1] ? match[1] : null;
      }

      /* -----------------------------------------------------------------------
         TOAST NOTIFICATIONS
         ----------------------------------------------------------------------- */
      function showToast(message, type = 'error', durationMs = 4500) {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.setAttribute('role', 'alert');

        toast.innerHTML = `
          <span class="toast-icon" aria-hidden="true">
            ${type === 'error' ? ICONS.errorIcon : ICONS.infoIcon}
          </span>
          <div class="toast-body"></div>
          <button type="button" class="toast-close" aria-label="Dismiss notification">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        `;

        // Use textContent to avoid any HTML injection
        toast.querySelector('.toast-body').textContent = message;

        const dismiss = () => {
          toast.classList.remove('show');
          window.setTimeout(() => toast.remove(), 200);
        };

        toast.querySelector('.toast-close').addEventListener('click', dismiss);
        els.toastRegion.appendChild(toast);

        requestAnimationFrame(() => {
          toast.classList.add('show');
        });

        if (durationMs > 0) {
          window.setTimeout(dismiss, durationMs);
        }
      }

      /* -----------------------------------------------------------------------
         BUILD 100-TILE DOM MATRIX ONCE ON INITIALIZATION
         ----------------------------------------------------------------------- */
      function buildGridSkeleton() {
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < TOTAL_PLAYERS; i++) {
          const tileNumber = i + 1;

          const tile = document.createElement('div');
          tile.className = 'player-tile';
          tile.dataset.index = String(i);

          const placeholder = document.createElement('div');
          placeholder.className = 'tile-placeholder';
          placeholder.innerHTML = `
            <span class="placeholder-index">#${tileNumber}</span>
            <span class="placeholder-state">Standby</span>
          `;

          const mount = document.createElement('div');
          mount.className = 'player-mount';
          mount.id = `yt-mount-${i}`;

          const badge = document.createElement('span');
          badge.className = 'tile-badge';
          badge.textContent = `#${tileNumber}`;

          const audioBtn = document.createElement('button');
          audioBtn.type = 'button';
          audioBtn.className = 'tile-audio-btn';
          audioBtn.setAttribute('aria-label', `Unmute player #${tileNumber}`);
          audioBtn.setAttribute('title', `Toggle audio for #${tileNumber}`);
          audioBtn.innerHTML = ICONS.speakerMuted;
          audioBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleSinglePlayerAudio(i);
          });

          tile.appendChild(placeholder);
          tile.appendChild(mount);
          tile.appendChild(badge);
          tile.appendChild(audioBtn);
          fragment.appendChild(tile);

          tileRefs.push({
            tile,
            mount,
            placeholderState: placeholder.querySelector('.placeholder-state'),
            audioBtn,
          });
        }

        els.videoGrid.appendChild(fragment);
      }

      /* -----------------------------------------------------------------------
         UI & STATUS SYNCHRONIZATION
         ----------------------------------------------------------------------- */
      function getReadyPlayerCount() {
        let count = 0;
        for (let i = 0; i < TOTAL_PLAYERS; i++) {
          if (state.loadedFlags[i] || state.ytReadyFlags[i]) count++;
        }
        return count;
      }

      function getUnmutedIndices() {
        const active = [];
        for (let i = 0; i < TOTAL_PLAYERS; i++) {
          if (!state.tileMuted[i]) active.push(i);
        }
        return active;
      }

      function updateTileAudioVisual(index) {
        const ref = tileRefs[index];
        if (!ref) return;

        const isMuted = state.tileMuted[index];
        const tileNum = index + 1;
        ref.tile.classList.toggle('audio-active', !isMuted && Boolean(state.currentVideoId));
        ref.audioBtn.innerHTML = isMuted ? ICONS.speakerMuted : ICONS.speakerActive;
        ref.audioBtn.setAttribute('aria-label', `${isMuted ? 'Unmute' : 'Mute'} player #${tileNum}`);
        ref.audioBtn.setAttribute('title', `${isMuted ? 'Unmute' : 'Mute'} #${tileNum}`);
      }

      function updateControlBarUI() {
        const hasVideo = Boolean(state.currentVideoId);
        const readyCount = getReadyPlayerCount();

        // Status text (Video ID & Player Count)
        els.statusVideoId.textContent = hasVideo ? state.currentVideoId : '—';
        els.statusPlayerCount.textContent = `${readyCount} / ${TOTAL_PLAYERS}`;

        // Enable / disable playback controls
        els.muteToggleBtn.disabled = !hasVideo;
        els.soloBtn.disabled = !hasVideo;
        els.stopClearBtn.disabled = !hasVideo;

        // Compute aggregate audio state from tileMuted array
        const unmuted = hasVideo ? getUnmutedIndices() : [];
        const allMuted = unmuted.length === 0;
        const isSoloFirst = unmuted.length === 1 && unmuted[0] === 0;
        const allUnmuted = unmuted.length === TOTAL_PLAYERS;

        // Update Mute All / Unmute All toggle button
        if (allMuted) {
          els.muteToggleBtn.classList.remove('btn-audio-live');
          els.muteToggleBtn.classList.add('btn-audio-muted');
          els.muteToggleBtn.setAttribute('aria-pressed', 'true');
          els.muteToggleIcon.innerHTML = ICONS.speakerMuted;
          els.muteToggleLabel.textContent = 'Unmute All';
        } else {
          els.muteToggleBtn.classList.remove('btn-audio-muted');
          els.muteToggleBtn.classList.add('btn-audio-live');
          els.muteToggleBtn.setAttribute('aria-pressed', 'false');
          els.muteToggleIcon.innerHTML = ICONS.speakerActive;
          els.muteToggleLabel.textContent = 'Mute All';
        }

        // Update Solo Audio (#1 Only) active highlight
        els.soloBtn.classList.toggle('btn-solo-active', isSoloFirst);
        els.soloBtn.classList.toggle('btn-secondary', !isSoloFirst);
        els.soloBtn.setAttribute('aria-pressed', String(isSoloFirst));

        // Update Audio status label with explicit text + semantic color
        els.statusAudioState.classList.remove('is-muted', 'is-live', 'is-solo');
        if (allMuted) {
          els.statusAudioState.textContent = 'Muted';
          els.statusAudioState.classList.add('is-muted');
        } else if (isSoloFirst) {
          els.statusAudioState.textContent = 'Solo #1';
          els.statusAudioState.classList.add('is-solo');
        } else if (allUnmuted) {
          els.statusAudioState.textContent = 'Unmuted (100x)';
          els.statusAudioState.classList.add('is-live');
        } else {
          els.statusAudioState.textContent = `${unmuted.length} Unmuted`;
          els.statusAudioState.classList.add('is-live');
        }
      }

      function updateProgressBar(completedCount) {
        const pct = Math.min(100, Math.round((completedCount / TOTAL_PLAYERS) * 100));
        els.loadProgressFill.style.width = `${pct}%`;
        if (pct > 0 && pct < 100) {
          els.loadProgressFill.classList.add('active');
        } else {
          window.setTimeout(() => {
            els.loadProgressFill.classList.remove('active');
            els.loadProgressFill.style.width = '0%';
          }, 300);
        }
      }

      /* -----------------------------------------------------------------------
         PROGRAMMATIC AUDIO & PLAYBACK CONTROL (REAL-TIME, NO RESTART)
         Uses official YT.Player API when bound, with direct YouTube IFrame
         postMessage command fallback so controls work immediately in all frames.
         ----------------------------------------------------------------------- */
      function sendYouTubeCommand(index, func, args = []) {
        const player = state.players[index];
        if (player && state.ytReadyFlags[index] && typeof player[func] === 'function') {
          try {
            player[func](...args);
            return;
          } catch (_) {
            // Fall through to postMessage command
          }
        }

        const iframe = state.iframes[index];
        if (iframe && iframe.contentWindow) {
          try {
            iframe.contentWindow.postMessage(
              JSON.stringify({ event: 'command', func, args }),
              '*'
            );
          } catch (_) {
            // Safely ignore if an iframe is mid-teardown
          }
        }
      }

      function applyPlayerAudio(index, shouldMute) {
        state.tileMuted[index] = shouldMute;

        if (state.loadedFlags[index] || state.ytReadyFlags[index]) {
          if (shouldMute) {
            sendYouTubeCommand(index, 'mute');
          } else {
            sendYouTubeCommand(index, 'unMute');
            sendYouTubeCommand(index, 'setVolume', [100]);
            // Ensure playback is active on user gesture if browser held autoplay
            sendYouTubeCommand(index, 'playVideo');
          }
        }

        updateTileAudioVisual(index);
      }

      /**
       * Mute all 100 YT.Player instances simultaneously without restarting playback.
       */
      function muteAll() {
        state.audioMode = 'muted';
        for (let i = 0; i < TOTAL_PLAYERS; i++) {
          applyPlayerAudio(i, true);
        }
        updateControlBarUI();
      }

      /**
       * Unmute all 100 YT.Player instances and set volume to 100 in real time.
       */
      function unmuteAll() {
        state.audioMode = 'all';
        for (let i = 0; i < TOTAL_PLAYERS; i++) {
          applyPlayerAudio(i, false);
        }
        updateControlBarUI();
      }

      /**
       * Solo Audio (#1 Only): unmutes player #1 at volume 100 and mutes #2–#100.
       */
      function soloAudioFirst() {
        state.audioMode = 'solo';
        for (let i = 0; i < TOTAL_PLAYERS; i++) {
          applyPlayerAudio(i, i !== 0);
        }
        updateControlBarUI();
      }

      /**
       * Toggle mute/unmute on an individual tile (#1–#100).
       */
      function toggleSinglePlayerAudio(index) {
        if (!state.currentVideoId) return;
        state.audioMode = 'custom';
        const nextMuted = !state.tileMuted[index];
        applyPlayerAudio(index, nextMuted);
        updateControlBarUI();
      }

      /* -----------------------------------------------------------------------
         STOP / CLEAR ALL — FULL MEMORY CLEANUP
         ----------------------------------------------------------------------- */
      function stopAndClearAll() {
        // Increment session ID to invalidate any in-flight batch callbacks
        state.loadSessionId++;

        // Cancel pending staggered timers
        for (const timerId of state.batchTimers) {
          window.clearTimeout(timerId);
        }
        state.batchTimers = [];

        // Destroy every active YT.Player & iframe to release browser memory and decoders
        for (let i = 0; i < TOTAL_PLAYERS; i++) {
          const player = state.players[i];
          if (player) {
            try {
              if (typeof player.stopVideo === 'function') player.stopVideo();
              if (typeof player.destroy === 'function') player.destroy();
            } catch (_) {
              // Ignore teardown exceptions on half-initialized players
            }
            state.players[i] = null;
          }

          const iframe = state.iframes[i];
          if (iframe) {
            try {
              iframe.onload = null;
              iframe.src = 'about:blank';
            } catch (_) {}
            state.iframes[i] = null;
          }

          state.ytAttachedFlags[i] = false;
          state.loadedFlags[i] = false;
          state.ytReadyFlags[i] = false;
          state.tileMuted[i] = true;

          // Recreate fresh clean mount container for the next load
          const ref = tileRefs[i];
          if (ref) {
            ref.tile.classList.remove('is-loaded', 'is-loading', 'audio-active', 'tile-error');
            ref.placeholderState.textContent = 'Standby';
            ref.mount.innerHTML = '';
            updateTileAudioVisual(i);
          }
        }

        state.currentVideoId = null;
        state.audioMode = 'muted';
        state.embedErrorShownForSession = false;

        updateProgressBar(0);
        updateControlBarUI();
      }

      /* -----------------------------------------------------------------------
         YOUTUBE EMBED URL BUILDER & ERROR HANDLING
         ----------------------------------------------------------------------- */
      function buildEmbedUrl(videoId) {
        const params = new URLSearchParams({
          autoplay: '1',
          mute: '1',
          loop: '1',
          playlist: videoId,
          controls: '1',
          modestbranding: '1',
          rel: '0',
          playsinline: '1',
          enablejsapi: '1',
        });

        // Only pass `origin` on top-level http(s) pages. Inside nested cross-origin
        // preview iframes or local file:// pages, passing `origin` breaks YouTube's
        // postMessage handshake and prevents playback / API callbacks.
        try {
          const isTopLevel = window.self === window.top;
          if (
            isTopLevel &&
            /^https?:$/i.test(window.location.protocol) &&
            window.location.origin &&
            window.location.origin !== 'null'
          ) {
            params.set('origin', window.location.origin);
          }
        } catch (_) {
          // Cross-origin nested iframe: intentionally omit `origin`
        }

        return `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?${params.toString()}`;
      }

      function handlePlayerError(index, errorCode, sessionId) {
        if (sessionId !== state.loadSessionId) return;

        const ref = tileRefs[index];
        if (ref) {
          ref.tile.classList.remove('is-loading');
          ref.tile.classList.add('tile-error');
          ref.placeholderState.textContent = `Err ${errorCode}`;
        }

        // Show one clear toast per load session for embed/availability restrictions
        if (!state.embedErrorShownForSession) {
          state.embedErrorShownForSession = true;
          if (errorCode === 101 || errorCode === 150) {
            showToast(
              `This video owner has disabled external embedding (YouTube error ${errorCode}). Try another public video.`,
              'error',
              6500
            );
          } else if (errorCode === 100) {
            showToast('Video not found or set to private (YouTube error 100).', 'error', 6000);
          } else if (errorCode === 153) {
            showToast(
              'YouTube rejected the embed referrer (error 153). Open the page over HTTP/HTTPS or try another browser tab.',
              'error',
              6500
            );
          } else {
            showToast(`YouTube playback error (code ${errorCode}).`, 'error', 5000);
          }
        }
      }

      /* -----------------------------------------------------------------------
         LOAD & PLAY ALL (100x) — STAGGERED IN BATCHES OF 10 EVERY 150ms
         ----------------------------------------------------------------------- */
      function loadAndPlayAll(videoId) {
        // Clean out any previous session before spawning new players
        stopAndClearAll();

        const sessionId = state.loadSessionId;
        state.currentVideoId = videoId;
        state.audioMode = 'muted';
        state.embedErrorShownForSession = false;

        // Mark all 100 tiles into loading visual state
        for (let i = 0; i < TOTAL_PLAYERS; i++) {
          tileRefs[i].tile.classList.add('is-loading');
          tileRefs[i].placeholderState.textContent = 'Queued';
        }

        updateControlBarUI();
        updateProgressBar(5);

        const embedUrl = buildEmbedUrl(videoId);
        const totalBatches = Math.ceil(TOTAL_PLAYERS / BATCH_SIZE);

        for (let batchIdx = 0; batchIdx < totalBatches; batchIdx++) {
          const timerId = window.setTimeout(() => {
            if (sessionId !== state.loadSessionId) return;

            const start = batchIdx * BATCH_SIZE;
            const end = Math.min(start + BATCH_SIZE, TOTAL_PLAYERS);

            for (let i = start; i < end; i++) {
              createSinglePlayer(i, embedUrl, sessionId);
            }

            updateProgressBar(end);
          }, batchIdx * BATCH_DELAY_MS);

          state.batchTimers.push(timerId);
        }
      }

      function attachYouTubePlayerInstance(index, sessionId) {
        if (sessionId !== state.loadSessionId) return;
        if (!state.apiReady || !window.YT || !window.YT.Player) return;
        if (state.ytAttachedFlags[index]) return;

        const iframe = state.iframes[index];
        if (!iframe || !iframe.id || !document.getElementById(iframe.id)) return;

        state.ytAttachedFlags[index] = true;

        try {
          state.players[index] = new window.YT.Player(iframe.id, {
            events: {
              onReady: (event) => {
                if (sessionId !== state.loadSessionId) {
                  try { event.target.destroy(); } catch (_) {}
                  return;
                }

                state.ytReadyFlags[index] = true;
                state.loadedFlags[index] = true;

                const ref = tileRefs[index];
                if (ref) {
                  ref.tile.classList.remove('is-loading');
                  ref.tile.classList.add('is-loaded');
                }

                // Respect whichever audio mode the user currently selected
                const shouldMute = state.tileMuted[index];
                try {
                  if (shouldMute) {
                    event.target.mute();
                  } else {
                    event.target.unMute();
                    event.target.setVolume(100);
                  }
                  event.target.playVideo();
                } catch (_) {}

                updateTileAudioVisual(index);
                updateControlBarUI();
              },
              onError: (event) => {
                handlePlayerError(index, event.data, sessionId);
              },
            },
          });
        } catch (_) {
          state.ytAttachedFlags[index] = false;
        }
      }

      function createSinglePlayer(index, embedUrl, sessionId) {
        const ref = tileRefs[index];
        if (!ref) return;

        const iframeId = `yt-player-${sessionId}-${index}`;
        const iframe = document.createElement('iframe');
        iframe.id = iframeId;
        iframe.title = `YouTube feed #${index + 1}`;
        iframe.width = '100%';
        iframe.height = '100%';
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute(
          'allow',
          'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'
        );
        iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
        iframe.referrerPolicy = 'strict-origin-when-cross-origin';
        iframe.allowFullscreen = true;

        iframe.onload = () => {
          if (sessionId !== state.loadSessionId) return;

          state.loadedFlags[index] = true;
          ref.tile.classList.remove('is-loading');
          ref.tile.classList.add('is-loaded');
          updateTileAudioVisual(index);
          updateControlBarUI();

          // Initiate JS API listening & ensure playback/audio policy immediately
          try {
            if (iframe.contentWindow) {
              iframe.contentWindow.postMessage(
                JSON.stringify({ event: 'listening', id: index + 1, channel: 'widget' }),
                '*'
              );
            }
          } catch (_) {}

          if (state.tileMuted[index]) {
            sendYouTubeCommand(index, 'mute');
          } else {
            sendYouTubeCommand(index, 'unMute');
            sendYouTubeCommand(index, 'setVolume', [100]);
          }
          sendYouTubeCommand(index, 'playVideo');

          // Bind official YT.Player API instance onto this existing iframe
          attachYouTubePlayerInstance(index, sessionId);
        };

        ref.mount.innerHTML = '';
        ref.placeholderState.textContent = 'Connecting';
        state.iframes[index] = iframe;

        // Assign src after attributes & onload are configured
        iframe.src = embedUrl;
        ref.mount.appendChild(iframe);
      }

      /* -----------------------------------------------------------------------
         GRID DENSITY / ZOOM MODE SWITCHER
         ----------------------------------------------------------------------- */
      function setDensityMode(mode) {
        state.density = mode;
        const isFit = mode === 'fit';

        document.body.classList.toggle('mode-fit', isFit);
        document.body.classList.toggle('mode-scroll', !isFit);

        els.densityFitBtn.classList.toggle('active', isFit);
        els.densityFitBtn.setAttribute('aria-pressed', String(isFit));

        els.densityScrollBtn.classList.toggle('active', !isFit);
        els.densityScrollBtn.setAttribute('aria-pressed', String(!isFit));
      }

      /* -----------------------------------------------------------------------
         YOUTUBE IFRAME PLAYER API BOOTSTRAP
         ----------------------------------------------------------------------- */
      function loadYouTubeIframeAPI() {
        if (window.YT && window.YT.Player) {
          handleYouTubeAPIReady();
          return;
        }

        const prevCallback = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = () => {
          if (typeof prevCallback === 'function') prevCallback();
          handleYouTubeAPIReady();
        };

        const script = document.createElement('script');
        script.src = 'https://www.youtube.com/iframe_api';
        script.async = true;
        script.onload = () => {
          if (window.YT && typeof window.YT.ready === 'function') {
            window.YT.ready(handleYouTubeAPIReady);
          }
        };
        document.head.appendChild(script);
      }

      function handleYouTubeAPIReady() {
        state.apiReady = true;

        // Attach official YT.Player to any iframes already mounted before API finished loading
        if (state.currentVideoId) {
          const sessionId = state.loadSessionId;
          for (let i = 0; i < TOTAL_PLAYERS; i++) {
            if (state.iframes[i] && state.loadedFlags[i] && !state.ytAttachedFlags[i]) {
              attachYouTubePlayerInstance(i, sessionId);
            }
          }
        }
      }

      /* -----------------------------------------------------------------------
         EVENT LISTENERS
         ----------------------------------------------------------------------- */
      function bindEvents() {
        // Primary Load & Play All (100x) submit
        els.loadForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const rawValue = els.urlInput.value;
          const videoId = extractYouTubeVideoId(rawValue);

          if (!videoId) {
            showToast(
              'Invalid YouTube URL or Video ID. Paste a valid watch, youtu.be, Shorts, or 11-character video ID.',
              'error'
            );
            els.urlInput.focus();
            els.urlInput.select();
            return;
          }

          loadAndPlayAll(videoId);
        });

        // Show/hide clear input button
        els.urlInput.addEventListener('input', () => {
          els.clearInputBtn.classList.toggle('visible', els.urlInput.value.length > 0);
        });

        els.clearInputBtn.addEventListener('click', () => {
          els.urlInput.value = '';
          els.clearInputBtn.classList.remove('visible');
          els.urlInput.focus();
        });

        // Global Mute All / Unmute All toggle
        els.muteToggleBtn.addEventListener('click', () => {
          if (!state.currentVideoId) return;
          const unmuted = getUnmutedIndices();
          if (unmuted.length === 0) {
            unmuteAll();
          } else {
            muteAll();
          }
        });

        // Solo Audio (#1 Only) quick action
        els.soloBtn.addEventListener('click', () => {
          if (!state.currentVideoId) return;
          soloAudioFirst();
        });

        // Stop / Clear All memory release
        els.stopClearBtn.addEventListener('click', () => {
          stopAndClearAll();
        });

        // Grid Density / Zoom controls
        els.densityFitBtn.addEventListener('click', () => setDensityMode('fit'));
        els.densityScrollBtn.addEventListener('click', () => setDensityMode('scroll'));

        // Keyboard Escape dismisses active toasts
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            els.toastRegion.innerHTML = '';
          }
        });
      }

      /* -----------------------------------------------------------------------
         INIT
         ----------------------------------------------------------------------- */
      buildGridSkeleton();
      bindEvents();
      updateControlBarUI();
      loadYouTubeIframeAPI();
    })();
  </script>
</body>
</html>
